<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制造业安全管理工作台 · 63模块全景</title>
<style>
  :root {
    --brand-50:#EAF0FF; --brand-100:#D4E1FF; --brand-200:#A8C4FF; --brand-300:#7AA3F7;
    --brand-400:#4D80EE; --brand-500:#2B5CE6; --brand-600:#1E4FC4; --brand-700:#173FA3;
    --cyan-400:#00B8D9; --cyan-500:#00A0BE; --cyan-600:#00859E;
    --success-500:#00B578; --warning-500:#FF8800; --danger-500:#F53F3F;
    --risk-major:#F53F3F; --risk-high:#FF7D00; --risk-mid:#F7BA1E; --risk-low:#1677FF;
    --gray-0:#FFFFFF; --gray-1:#F7F8FA; --gray-2:#F2F3F5; --gray-3:#E5E6EB;
    --gray-4:#C9CDD4; --gray-5:#86909C; --gray-6:#4E5969; --gray-7:#1D2129;
    --text-1:#1D2129; --text-2:#4E5969; --text-3:#86909C;
    --bg-page:var(--gray-2); --bg-card:var(--gray-0); --bg-sub:var(--gray-1);
    --border-1:#E5E6EB; --border-2:#C9CDD4;
    --font-family:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    --font-numeric:"DIN Alternate","Roboto","HarmonyOS Sans SC",monospace;
    --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px;
    --radius-6:6px; --radius-8:8px; --radius-12:12px; --radius-full:999px;
    --shadow-1:0 1px 2px rgba(29,33,41,.06); --shadow-2:0 4px 12px rgba(29,33,41,.10);
    --dur-base:200ms; --ease:cubic-bezier(.2,0,0,1);
  }
  :root[data-theme="dark"] {
    --bg-page:#0E1013; --bg-card:#17191E; --bg-sub:#1F2228;
    --text-1:#F2F3F5; --text-2:#C9CDD4; --text-3:#86909C;
    --border-1:#2E3138; --border-2:#41454D;
    --brand-500:#3D7BFF; --brand-600:#5B90FF; --cyan-400:#33D6EA;
    --risk-major:#F76560; --risk-high:#FF9A2E; --risk-mid:#FBDC6D; --risk-low:#3D9BFF;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family:var(--font-family); color:var(--text-1); background:var(--bg-page); line-height:1.6; overflow:hidden; transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease); }
  button { font-family:inherit; cursor:pointer; }
  input,select,textarea { font-family:inherit; font-size:13px; }
  a { color:var(--brand-500); text-decoration:none; }

  .app { display:flex; height:100vh; }

  /* 侧边栏 */
  .sidebar { width:248px; min-width:248px; background:var(--bg-card); border-right:1px solid var(--border-1); display:flex; flex-direction:column; overflow:hidden; }
  .sb-brand { height:56px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--border-1); font-weight:600; font-size:14px; }
  .sb-brand .mark { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--brand-500),var(--cyan-400)); display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; }
  .sb-nav { flex:1; overflow-y:auto; padding:8px; }
  .cat { margin-bottom:2px; }
  .cat-head { width:100%; display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border:none; background:transparent; color:var(--text-2); font-size:13px; font-weight:600; border-radius:8px; text-align:left; }
  .cat-head:hover { background:var(--bg-sub); }
  .cat-head .cnt { font-size:11px; color:var(--text-3); font-weight:400; }
  .mod-list { display:none; padding-left:6px; }
  .cat.open .mod-list { display:block; }
  .mod-item { width:100%; display:flex; align-items:center; gap:7px; padding:6px 10px; border:none; background:transparent; color:var(--text-2); font-size:13px; border-radius:8px; text-align:left; }
  .mod-item:hover { background:var(--bg-sub); }
  .mod-item.active { background:var(--brand-50); color:var(--brand-600); font-weight:500; }
  .mod-item .code { font-family:var(--font-numeric); font-size:11px; color:var(--text-3); width:24px; flex:none; }
  .prio-dot { width:6px; height:6px; border-radius:50%; flex:none; }
  .prio-dot.p0 { background:var(--brand-500); }
  .prio-dot.p1 { background:var(--warning-500); }
  .prio-dot.p2 { background:var(--gray-4); }

  /* 顶部栏 */
  .topbar { height:56px; flex:none; display:flex; align-items:center; gap:16px; padding:0 20px; background:var(--bg-card); border-bottom:1px solid var(--border-1); }
  .crumb { font-size:13px; color:var(--text-2); }
  .crumb b { color:var(--text-1); }
  .topbar .spacer { flex:1; }
  .db-badge { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-3); }
  .db-badge .dot { width:7px; height:7px; border-radius:50%; background:var(--gray-4); }
  .db-badge.ok .dot { background:var(--success-500); }
  .db-badge.err .dot { background:var(--danger-500); }
  .theme-btn { border:1px solid var(--border-1); background:var(--bg-card); color:var(--text-2); width:32px; height:32px; border-radius:999px; display:grid; place-items:center; font-size:13px; }
  .stat-note { font-size:12px; color:var(--text-3); }

  /* 内容区 */
  .content { flex:1; overflow-y:auto; padding:24px 28px; }

  .page-head { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .page-head h1 { font-size:20px; font-weight:700; }
  .prio { padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .prio.p0 { background:color-mix(in srgb,var(--brand-500) 12%,transparent); color:var(--brand-500); }
  .prio.p1 { background:color-mix(in srgb,var(--warning-500) 14%,transparent); color:#B65C00; }
  .prio.p2 { background:var(--bg-sub); color:var(--text-3); }
  .desc { font-size:13px; color:var(--text-2); margin-bottom:20px; max-width:900px; }

  .grid { display:grid; gap:16px; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
  .stat-card { background:var(--bg-card); border:1px solid var(--border-1); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow-1); }
  .stat-card .k { font-size:12px; color:var(--text-3); }
  .stat-card .v { font-family:var(--font-numeric); font-size:26px; font-weight:700; color:var(--brand-500); line-height:1.2; }

  .split { display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
  .split.full { grid-template-columns:1fr; }
  .card { background:var(--bg-card); border:1px solid var(--border-1); border-radius:12px; padding:18px; box-shadow:var(--shadow-1); }
  .card h3 { font-size:14px; font-weight:600; margin-bottom:14px; }

  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .form-row.one { grid-template-columns:1fr; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; color:var(--text-3); }
  .field input,.field select,.field textarea { min-height:36px; padding:0 12px; border:1px solid var(--border-2); border-radius:6px; background:var(--bg-card); color:var(--text-1); }
  .field textarea { padding:8px 12px; min-height:64px; resize:vertical; }
  .field input:focus,.field select:focus,.field textarea:focus { outline:none; border-color:var(--brand-500); }

  .btn { height:36px; padding:0 16px; border-radius:6px; border:none; font-size:13px; font-weight:500; color:#fff; background:var(--brand-500); }
  .btn:hover { background:var(--brand-600); }
  .btn.ghost { background:var(--bg-sub); color:var(--text-2); border:1px solid var(--border-1); }
  .btn.mini { height:26px; padding:0 11px; font-size:12px; border-radius:999px; }

  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 11px; border-bottom:1px solid var(--border-1); white-space:nowrap; }
  th { color:var(--text-3); font-size:12px; font-weight:500; position:sticky; top:0; background:var(--bg-card); }
  tbody tr:hover { background:var(--bg-sub); }
  .code { font-family:var(--font-numeric); color:var(--brand-500); font-size:12px; }

  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; line-height:18px; }
  .pill.gray { background:var(--bg-sub); color:var(--text-2); }
  .pill.brand { background:color-mix(in srgb,var(--brand-500) 12%,transparent); color:var(--brand-500); }
  .pill.ok { background:color-mix(in srgb,var(--success-500) 14%,transparent); color:var(--success-500); }
  .pill.warn { background:color-mix(in srgb,var(--warning-500) 14%,transparent); color:#B65C00; }
  .pill.danger { background:color-mix(in srgb,var(--danger-500) 12%,transparent); color:var(--danger-500); }
  .pill.mid { background:color-mix(in srgb,var(--risk-mid) 16%,transparent); color:#B38600; }
  .pill.low { background:color-mix(in srgb,var(--risk-low) 12%,transparent); color:var(--risk-low); }

  .empty { padding:28px; text-align:center; color:var(--text-3); font-size:13px; }
  .msg { margin-top:10px; font-size:12px; color:var(--text-3); }
  .msg.err { color:var(--danger-500); }

  .ov-card { background:var(--bg-card); border:1px solid var(--border-1); border-radius:12px; padding:22px; box-shadow:var(--shadow-1); margin-bottom:16px; }
  .ov-card h3 { font-size:14px; font-weight:600; margin-bottom:6px; }
  .ov-card .sub { font-size:12px; color:var(--text-3); margin-bottom:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { padding:4px 11px; border-radius:999px; background:var(--bg-sub); font-size:12px; color:var(--text-2); }
  .note { margin-top:14px; font-size:12px; color:var(--text-3); border-top:1px dashed var(--border-2); padding-top:12px; }

  .matrix { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .mc { border-radius:12px; padding:14px; color:#fff; }
  .mc .n { font-size:13px; font-weight:600; }
  .mc .v { font-family:var(--font-numeric); font-size:24px; font-weight:700; }

  @media (max-width:1020px){ .sidebar{width:210px;min-width:210px;} .stats{grid-template-columns:repeat(3,1fr);} .split{grid-template-columns:1fr;} .matrix{grid-template-columns:1fr 1fr;} }

  /* ===== 移动端自适应（抽屉导航 + 触控优化） ===== */
  .nav-toggle { display:none; width:34px; height:34px; border:1px solid var(--border-1); border-radius:8px; background:var(--bg-card); color:var(--text-1); font-size:16px; place-items:center; flex:none; }
  .backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:99; }
  @media (max-width:900px){
    .nav-toggle { display:grid; }
    .sidebar { position:fixed; top:0; left:0; bottom:0; z-index:100; width:264px; min-width:264px; transform:translateX(-100%); transition:transform .25s var(--ease); box-shadow:var(--shadow-2); }
    .sidebar.open { transform:none; }
    body.nav-open .backdrop { display:block; }
    .stat-note { display:none; }
    .content { padding:14px 12px 28px; }
    .page-head h1 { font-size:17px; }
    .stats { grid-template-columns:1fr 1fr; gap:10px; }
    .stat-card { padding:12px 14px; }
    .stat-card .v { font-size:22px; }
    .card { padding:14px; }
    th, td { padding:8px 9px; font-size:12px; }
    .btn { min-height:36px; }
    .btn.mini { min-height:30px; }
    .field input,.field select,.field textarea { min-height:40px; font-size:15px; } /* 防 iOS 聚焦缩放 */
    .crumb { max-width:32vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #loginSel { max-width:150px; }
  }
  @media (max-width:560px){
    .matrix { grid-template-columns:1fr; }
    .form-row { grid-template-columns:1fr; }
    .topbar { gap:8px; padding:0 12px; }
    #loginSel { max-width:118px; font-size:11px; }
    .theme-btn { width:30px; height:30px; }
    .btn.mini.ghost { display:none; } /* 小屏隐藏次要按钮，功能保留在模块内 */
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><span class="mark">M</span> 制造业安全工作台</div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>
  <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
    <header class="topbar">
      <button class="nav-toggle" id="navToggle" title="菜单">☰</button>
      <div class="crumb" id="crumb">制造业安全管理系统 / <b>全景</b></div>
      <div class="spacer"></div>
      <select id="loginSel" title="演示登录" onchange="loginAs(this.value)" style="height:32px;padding:0 8px;border:1px solid var(--border-1);border-radius:6px;background:var(--bg-card);color:var(--text-1);font-size:12px">
        <option value="admin">魏先生 · ADMIN</option>
        <option value="safety">张伟 · 安全员</option>
        <option value="workshop">王海 · 车间管理员</option>
        <option value="employee">李强 · 员工</option>
      </select>
      <button class="btn mini ghost" onclick="runJobs()" title="手动运行定时任务">运行定时任务</button>
      <button class="btn mini ghost" onclick="backupToGist()" title="备份数据到 GitHub Gist">备份到云端</button>
      <button class="btn mini ghost" onclick="restoreFromGist()" title="从 GitHub Gist 恢复数据">从云端恢复</button>
      <span class="stat-note" id="roleBadge"></span>
      <span class="db-badge" id="dbBadge"><span class="dot"></span><span id="dbText">本地库</span></span>
      <button class="theme-btn" id="themeBtn" title="明暗切换">◐</button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="datastore.js"></script>
<script>
(function(){
  var btn=document.getElementById('themeBtn'), root=document.documentElement, saved=null;
  try{saved=localStorage.getItem('msms63-theme');}catch(e){}
  if(saved) root.setAttribute('data-theme', saved);
  btn.addEventListener('click',function(){var c=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',c);try{localStorage.setItem('msms63-theme',c);}catch(e){}});
})();

/* ===== 工具函数 ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pill(text,cls){return '<span class="pill '+cls+'">'+esc(text)+'</span>';}
function pillCls(v){
  v=String(v||'');
  if(/CLOSED|FINISHED|VERIFIED|DONE|PASS|VALID|ACTIVE|SUCCESS|IN_USE|PUBLISHED|READ/.test(v)) return 'ok';
  if(/MAJOR|CRITICAL|EXPIRED|FAIL|EXCEPTION|DUE|FROZEN|LOCKED|FAILED|REJECTED|SCRAPPED/.test(v)) return 'danger';
  if(/HIGH|ORANGE|FIXING|ONGOING|IN_PROGRESS|DOING|SUBMITTED|INVESTIGATING|EXPIRING|MAINTENANCE|STARTED/.test(v)) return 'warn';
  if(/MID|YELLOW/.test(v)) return 'mid';
  if(/LOW|BLUE/.test(v)) return 'low';
  return 'gray';
}
function lbl(map,v){ return L[map]&&L[map][v]!=null ? L[map][v] : (v==null||v===''?'-':v); }

var __token=null; try{__token=localStorage.getItem('msms-token');}catch(e){}
async function api(method,path,body){
  return await route(method,path,body);
}
function setDb(ok,txt){var b=document.getElementById('dbBadge');b.className='db-badge '+(ok?'ok':'err');document.getElementById('dbText').textContent=txt;}
async function loginAs(u){
  try{ var d=await api('POST','/api/auth/login',{username:u}); if(d&&d.token){__token=d.token;try{localStorage.setItem('msms-token',__token);}catch(e){}} document.getElementById('roleBadge').textContent='当前：'+d.user.name+' · '+d.user.role; }
  catch(e){ document.getElementById('roleBadge').textContent='登录失败'; }
}
async function runJobs(){
  try{ var s=await api('POST','/api/jobs/run'); alert('已运行：生成检查任务 '+s.check_tasks_generated+'，隐患逾期 '+s.hazard_overdue+'，证书提醒 '+s.cert_reminders); }
  catch(e){ alert('运行失败：'+esc(e.message)); }
}

/* ===== 标签字典 ===== */
var L={
  hzStatus:{REPORTED:'待核实',VERIFIED:'待派单',ASSIGNED:'已派单',FIXING:'整改中',SUBMITTED:'待验收',CLOSED:'已销项',REJECTED:'已驳回'},
  riskLevel:{MAJOR:'重大',HIGH:'较大',MID:'一般',LOW:'低'},
  hzLevel:{GENERAL:'一般',MAJOR:'重大'},
  hazardSource:{REPORT:'随手拍',INSPECTION:'点检',PATROL:'巡查',IOT:'IoT',AI:'AI识别',CHECK:'检查'},
  permitType:{HOTWORK:'动火',CONFINED:'受限空间',HIGH:'高处',TEMP_POWER:'临时用电',ROAD_BLOCK:'断路',EXCAVATION:'动土',LIFTING:'吊装',BLIND_PLATE:'盲板抽堵',MAINTENANCE:'检修'},
  permitLevel:{GENERAL:'一般',MAJOR:'较大',CRITICAL:'严重'},
  permitStatus:{DRAFT:'草稿',SUBMITTED:'已提交',L1_APPROVED:'一级已审',L2_APPROVED:'二级已审',IN_PROGRESS:'作业中',FINISHED:'已完工',ARCHIVED:'已归档'},
  ticketStatus:{OPEN:'待处理',DOING:'处理中',PENDING_VERIFY:'待验收',CLOSED:'已关闭',REJECTED:'已驳回'},
  ticketType:{hazard_rectify:'隐患整改',equip_maintain:'设备维保',risk_review:'风险复评',permit_approve:'作业审批',training:'培训补考',capa:'纠正措施'},
  unitType:{COMPANY:'公司',DEPT:'部门',WORKSHOP:'车间',TEAM:'班组',POST:'岗位'},
  orgStatus:{ACTIVE:'启用',INACTIVE:'停用'},
  userStatus:{ACTIVE:'在职',FROZEN:'冻结',LOCKED:'锁定',LEFT:'离职'},
  scope:{SELF:'本人',TEAM:'班组',DEPT:'部门',WORKSHOP:'车间',ALL:'全公司'},
  roleStatus:{ACTIVE:'启用',INACTIVE:'停用'},
  dictScope:{DICT:'数据字典',CONFIG:'参数配置',INTEGRATION:'集成配置'},
  channel:{INBOX:'站内信',DINGTALK:'钉钉',SMS:'短信'},
  msgStatus:{SENT:'已发送',READ:'已读',FAILED:'失败'},
  trainType:{STAFF:'三级安全教育',SPECIAL:'专项培训',REVIEW:'复训',EMERGENCY:'应急培训'},
  trainStatus:{PLANNED:'计划中',ONGOING:'进行中',DONE:'已完成'},
  examStatus:{DRAFT:'草稿',OPEN:'已开放',CLOSED:'已关闭'},
  certType:{WELDER:'焊工证',FORKLIFT:'叉车证',ELECTRICIAN:'电工证',CRANE:'起重机司机',GAS:'煤气作业',SCAFFOLD:'高处作业'},
  certStatus:{VALID:'有效',EXPIRING:'临期',EXPIRED:'已过期'},
  eqStatus:{IN_USE:'在用',MAINTENANCE:'检修中',IDLE:'闲置',SCRAPPED:'已报废'},
  eqCategory:{SPECIAL:'特种设备',COMMON:'普通设备'},
  inspectResult:{PASS:'正常',FAIL:'异常',EXCEPTION:'待处理'},
  seqStatus:{IN_USE:'在用',DUE:'临检',EXPIRED:'过期'},
  seqKind:{CRANE:'起重机械',PRESSURE:'压力容器',BOILER:'锅炉',FORKLIFT:'场（厂）内机动车辆'},
  incidentCat:{VEHICLE:'车辆伤害',FIRE:'火灾',MECH:'机械伤害',ELEC:'触电',FALL:'高处坠落',CHEM:'中毒窒息',OTHER:'其他'},
  incidentLevel:{GENERAL:'一般',MAJOR:'较大',CRITICAL:'重大'},
  incidentStatus:{REPORTED:'已报告',INVESTIGATING:'调查中',CLOSED:'已结案'},
  invStatus:{ONGOING:'调查中',DONE:'已完成'},
  invMethod:{'5WHY':'5Why',FTA:'故障树','4M':'4M法',HAZOP:'HAZOP'},
  capaSource:{'事故':'事故','审核':'审核','演练':'演练','隐患':'隐患'},
  capaStatus:{OPEN:'待处理',DOING:'执行中',DONE:'已完成',VERIFIED:'已验证'},
  backupStatus:{SUCCESS:'成功',FAILED:'失败',RUNNING:'进行中'},
  contractorStatus:{ACTIVE:'合作中',TERMINATED:'已终止'},
  workerStatus:{PENDING:'待入厂',ADMITTED:'已入厂'},
  facilityType:{EXTINGUISHER:'灭火器',HYDRANT:'消火栓',SPRINKLER:'喷淋',SMOKE_DETECTOR:'烟感',FIRE_DOOR:'防火门',EMERGENCY_LIGHT:'应急照明'},
  facilityStatus:{NORMAL:'正常',EXPIRED:'检测到期',BROKEN:'故障'},
  patrolType:{PRE_SHIFT:'班前',DAILY:'日常',NIGHT:'夜间'},
  patrolResult:{PASS:'正常',ABNORMAL:'异常'},
  planStatus:{DRAFT:'编制中',PUBLISHED:'已发布'},

// 下一步状态：从后端 STATE_NEXT 单一真源推导（取 allowed 列表首个正向状态），不再维护前端副本
function nextOf(table, status){
  var map = STATE_NEXT[table];
  if(!map) return null;
  var allowed = map[status] || [];
  return allowed.length ? allowed[0] : null;
}

/* CRUD / 只读 */
function renderCrud(m,c){
  var head='<div class="page-head"><h1>'+esc(m.name)+'</h1><span class="prio '+m.prio.toLowerCase()+'">'+m.prio+'</span></div><p class="desc">'+esc(m.desc)+'</p>';
  var stats='<div class="stats" id="stats"></div>';
  var form='';
  if(m.type!=='readonly'){
    var rows=''; var n=0;
    m.form.forEach(function(f){
      var one=(f.t==='textarea'); if(one){ rows+='<div class="form-row one">'; } else { if(n%2===0) rows+='<div class="form-row">'; }
      var input='';
      if(f.t==='select'){ input='<select id="f-'+m.id+'-'+f.k+'">'+Object.keys(f.opt||{}).map(function(k){return '<option value="'+esc(k)+'">'+esc(f.opt[k])+'</option>';}).join('')+'</select>'; }
      else if(f.t==='textarea'){ input='<textarea id="f-'+m.id+'-'+f.k+'" placeholder="'+esc(f.l)+'"></textarea>'; }
      else if(f.t==='date'){ input='<input id="f-'+m.id+'-'+f.k+'" type="date">'; }
      else if(f.t==='datetime'){ input='<input id="f-'+m.id+'-'+f.k+'" type="datetime-local">'; }
      else if(f.t==='number'){ input='<input id="f-'+m.id+'-'+f.k+'" type="number">'; }
      else { input='<input id="f-'+m.id+'-'+f.k+'" placeholder="'+esc(f.l)+'">'; }
      rows+='<div class="field"><label>'+esc(f.l)+(f.req?' *':'')+'</label>'+input+'</div>';
      if(one){ rows+='</div>'; } else if(n%2===1){ rows+='</div>'; }
      n++;
    });
    if(n%2===1) rows+='</div>';
    form='<div class="card"><h3>新增'+esc(m.name)+'</h3>'+rows+'<button class="btn" onclick="submitCrud(\''+m.id+'\')">提交</button><div class="msg" id="msg-'+m.id+'"></div></div>';
  }
  c.innerHTML=head+stats+'<div class="split'+(m.type==='readonly'?' full':'')+'">'+form+'<div class="card"><h3>'+esc(m.name)+'台账</h3><div class="table-wrap" id="tbl-'+m.id+'"></div></div></div>';
  loadList(m);
}

async function loadList(m){
  try{
    var list=await api('GET','/api/table/'+m.table);
    setDb(true,'数据库已连接');
    renderStats(m,list);
    var rows=list.map(function(r){return crudRow(m,r);}).join('');
    var hasAct=m.status||m.id==='E2'||m.id==='I1';
    document.getElementById('tbl-'+m.id).innerHTML=list.length?
      '<table><thead><tr>'+m.cols.map(function(cl){return '<th>'+esc(cl.l)+'</th>';}).join('')+(hasAct?'<th>操作</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table>'
      :'<div class="empty">暂无数据</div>';
  }catch(e){
    setDb(false,'数据库未连接');
    document.getElementById('tbl-'+m.id).innerHTML='<div class="empty">'+esc(e.message)+'</div>';
  }
}

function cell(m,cl,r){
  var v=r[cl.k];
  if(cl.k==='created_at'||cl.k==='occurred_at'){ v=v?String(v).slice(0,16).replace('T',' '):'-'; }
  else if(cl.k==='file_size'||cl.k==='enabled'){ v=(cl.k==='enabled')?(v?'是':'否'):(v==null?'-':v); }
  if(cl.k==='overdue_flag'){ return v==1?pill('逾期','danger'):pill('正常','ok'); }
  if(cl.map) return pill(lbl(cl.map,v), pillCls(String(v==null?'':v)));
  return esc(v==null||v===''?'-':v);
}
function crudRow(m,r){
  var tds=m.cols.map(function(cl){ return '<td'+(cl.k==='code'?' class="code"':'')+'>'+cell(m,cl,r)+'</td>'; }).join('');
  var extra='';
  if(m.id==='E2'&&(r.result==='EXCEPTION'||r.result==='FAIL')) extra='<button class="btn mini" onclick="inspToHazard('+r.id+')">转隐患</button>';
  if(m.id==='I1'&&r.status!=='CLOSED') extra=(extra?extra+' ':'')+'<button class="btn mini" onclick="closeIncident('+r.id+')">结案</button>';
  var act='';
  if(m.status){ act=(nextOf(m.table, r[m.status.key])?'<button class="btn mini" onclick="advanceTo(\''+m.id+'\','+r.id+')">推进</button>':'<span class="pill ok">已闭环</span>'); }
  if(extra) act=act?(act+' '+extra):extra;
  return '<tr>'+tds+(act?'<td>'+act+'</td>':'')+'</tr>';
}
function renderStats(m,list){
  var cards=[{k:'总数',v:list.length}];
  (m.stats||[]).forEach(function(s){
    var g={}; list.forEach(function(x){ var v=x[s.by]||'未分类'; g[v]=(g[v]||0)+1; });
    Object.keys(g).sort(function(a,b){return g[b]-g[a];}).slice(0,3).forEach(function(k){ cards.push({k:lbl(s.map,k),v:g[k]}); });
  });
  document.getElementById('stats').innerHTML=cards.map(function(c){return '<div class="stat-card"><div class="k">'+esc(c.k)+'</div><div class="v">'+c.v+'</div></div>';}).join('');
}
async function submitCrud(id){
  var m=byId[id], body={};
  for(var f of m.form){ var el=document.getElementById('f-'+id+'-'+f.k); if(!el)continue; var v=el.value.trim(); if(f.t==='number'&&v!==''){ v=Number(v); } if(v!==''){ body[f.k]=v; } }
  var missing=m.form.filter(function(f){return f.req && (body[f.k]===undefined||body[f.k]==='');});
  var msg=document.getElementById('msg-'+id);
  if(missing.length){ msg.className='msg err'; msg.textContent='请填写：'+missing.map(function(f){return f.l;}).join('、'); return; }
  try{ await api('POST','/api/table/'+m.table,body); msg.className='msg'; msg.textContent='已保存，台账已刷新'; m.form.forEach(function(f){var el=document.getElementById('f-'+id+'-'+f.k); if(el) el.value='';}); loadList(m); }
  catch(e){ msg.className='msg err'; msg.textContent=esc(e.message); }
}

var DH_FIELDS={hazards:[['title','隐患描述*'],['dept','部门'],['location','位置'],['assignee','责任人'],['level','等级(GENERAL/MAJOR)']],equipment:[['name','设备名称*'],['dept','部门'],['category','类别(SPECIAL/COMMON)']],certificates:[['holder','持证人*'],['cert_type','类型'],['cert_no','证书编号'],['expire_date','到期日期(YYYY-MM-DD)']],users:[['name','姓名*'],['emp_no','工号*'],['dept','部门'],['phone','手机']]};
function renderDatahub(m,c){
  c.innerHTML='<div class="page-head"><h1>'+esc(m.name)+'</h1><span class="prio '+m.prio.toLowerCase()+'">'+m.prio+'</span></div><p class="desc">'+esc(m.desc)+'</p>'
    +'<div class="split"><div class="card"><h3>T1 数据导入</h3>'
    +'<div class="form-row"><div class="field"><label>目标表 *</label><select id="dh-table">'+Object.keys(DH_FIELDS).map(function(k){return '<option value="'+k+'">'+k+'</option>';}).join('')+'</select></div><div class="field"><label>下载模板</label><button class="btn ghost" style="width:100%" onclick="dhTemplate()">下载 CSV 模板</button></div></div>'
    +'<div class="field" style="margin-bottom:10px"><label>粘贴 CSV 数据（首行表头，逗号分隔）</label><textarea id="dh-csv" style="min-height:140px" placeholder="title,dept,location&#10;车间通道堆放纸箱,冲压车间,A2 通道"></textarea></div>'
    +'<button class="btn" onclick="dhImport()">开始导入</button><div class="msg" id="dh-msg"></div></div>'
    +'<div class="card"><h3>导入报告</h3><div id="dh-report"><div class="empty">暂无导入记录</div></div></div></div>';
}
function dhTemplate(){ var t=document.getElementById('dh-table').value; var header=DH_FIELDS[t].map(function(f){return f[0];}).join(','); var row=DH_FIELDS[t].map(function(f,i){return i===0?('示例'+f[1].replace('*','')):'';}).join(','); var csv='\ufeff'+header+'\r\n'+row+'\r\n'; var b=new Blob([csv],{type:'text/csv;charset=utf-8'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=t+'-import-template.csv'; a.click(); URL.revokeObjectURL(a.href); }
function parseCsv(text){
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim();});
  if(lines.length<2) throw new Error('至少需要表头+1行数据');
  function parseLine(line){ var out=[],cur='',inQ=false; for(var i=0;i<line.length;i++){ var ch=line[i]; if(ch==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; } else if(ch===','&&!inQ){ out.push(cur);cur=''; } else cur+=ch; } out.push(cur); return out; }
  var header=parseLine(lines[0]); var rows=[];
  for(var i=1;i<lines.length;i++){ var cells=parseLine(lines[i]); var o={}; header.forEach(function(h,j){ if(h.trim()) o[h.trim()]=String(cells[j]||'').trim(); }); rows.push(o); }
  return rows;
}
async function dhImport(){
  var t=document.getElementById('dh-table').value, csv=document.getElementById('dh-csv').value.trim(), msg=document.getElementById('dh-msg');
  if(!csv){ msg.className='msg err'; msg.textContent='请粘贴 CSV 数据'; return; }
  var rows; try{ rows=parseCsv(csv); }catch(e){ msg.className='msg err'; msg.textContent='CSV 解析失败：'+esc(e.message); return; }
  try{
    var r=await api('POST','/api/datahub/import',{table:t,rows:rows});
    var errHtml=(r.errors||[]).slice(0,20).map(function(e2){return '<div style="color:var(--danger-500);font-size:12px">第 '+e2.row+' 行：'+esc(e2.reason)+'</div>';}).join('');
    document.getElementById('dh-report').innerHTML='<div class="chips"><span class="chip">成功：'+r.ok+'</span><span class="chip">失败：'+r.fail+'</span></div>'+(errHtml||'<div class="note">全部导入成功</div>');
    msg.className='msg'; msg.textContent='导入完成';
  }catch(e){ msg.className='msg err'; msg.textContent=esc(e.message); }
}

/* ===== 初始化 ===== */
(async function init(){
  try{ await ensureSeed(); setDb(true,'本地库已就绪'); renderSidebar(); openModule('A1'); loginAs('admin'); }
  catch(e){ setDb(false,'初始化失败'); console.error(e); alert('初始化失败：'+(e&&e.message)); }
})();
</script>
